name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 02:30 UTC — picks up the latest ECB reference rates from
    # Frankfurter (ECB publishes around 16:00 CET each business day).
    - cron: "30 2 * * *"

permissions:
  id-token: write   # OIDC for AWS role assumption — no long-lived keys
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_HEADER: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_HEADER }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          NEXT_PUBLIC_ADSENSE_SLOT_IN_CONTENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_IN_CONTENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_FOOTER: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_FOOTER }}
          NEXT_PUBLIC_GA4_ID: ${{ secrets.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # HTML files get short cache so deploys go live fast.
      - name: Sync HTML (no-cache)
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      # Hashed assets get year-long cache (filenames change per build).
      - name: Sync immutable assets
        run: |
          aws s3 sync out/_next/static/ s3://${{ secrets.S3_BUCKET }}/_next/static/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/*.html" "/sitemap.xml" "/robots.txt"
