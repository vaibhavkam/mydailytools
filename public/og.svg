<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="315" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g opacity="0.06" fill="#fff">
    <circle cx="80"   cy="80"  r="2"/><circle cx="180"  cy="80"  r="2"/><circle cx="280"  cy="80"  r="2"/><circle cx="380"  cy="80"  r="2"/>
    <circle cx="480"  cy="80"  r="2"/><circle cx="580"  cy="80"  r="2"/><circle cx="680"  cy="80"  r="2"/><circle cx="780"  cy="80"  r="2"/>
    <circle cx="880"  cy="80"  r="2"/><circle cx="980"  cy="80"  r="2"/><circle cx="1080" cy="80"  r="2"/>
    <circle cx="80"   cy="180" r="2"/><circle cx="180"  cy="180" r="2"/><circle cx="280"  cy="180" r="2"/><circle cx="380"  cy="180" r="2"/>
    <circle cx="80"   cy="280" r="2"/><circle cx="180"  cy="280" r="2"/>
    <circle cx="80"   cy="380" r="2"/>
    <circle cx="980"  cy="480" r="2"/><circle cx="1080" cy="480" r="2"/>
    <circle cx="780"  cy="550" r="2"/><circle cx="880"  cy="550" r="2"/><circle cx="980"  cy="550" r="2"/><circle cx="1080" cy="550" r="2"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="120" height="120" rx="32" fill="url(#brand)"/>
    <g transform="translate(15, 15) scale(3.0)">
      <path d="M10 8.5l3.2 3.2a3 3 0 010 4.2L10 19.1l2.9 2.9 3.2-3.2a3 3 0 014.2 0L23.2 22 22 23.2l-2.9-2.9a3 3 0 00-4.2 0L11.6 23.5 8.5 20.4l3.2-3.2a3 3 0 000-4.2L8.5 9.7 10 8.5z" fill="#fff" fill-opacity="0.95"/>
      <circle cx="22" cy="10" r="1.6" fill="#fff"/>
    </g>
  </g>

  <text x="246" y="186" font-size="42" font-weight="600" fill="#fff" letter-spacing="-0.02em">MyDailyTools</text>

  <!-- headline -->
  <text x="96" y="320" font-size="78" font-weight="800" fill="#fff" letter-spacing="-0.025em">Every tool you need</text>
  <text x="96" y="406" font-size="78" font-weight="800" letter-spacing="-0.025em" fill="url(#brand)">for the daily web.</text>

  <!-- subhead -->
  <text x="96" y="478" font-size="28" font-weight="400" fill="#cbd5e1">Calculators &#183; Converters &#183; Developer tools &#183; Text tools</text>

  <!-- footer pill -->
  <rect x="96" y="528" width="380" height="48" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="118" y="559" font-size="20" font-weight="500" fill="#e2e8f0">100+ free tools &#183; no signup &#183; private</text>

  <!-- url -->
  <text x="1104" y="572" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="end">mydailytools.com</text>
</svg>
